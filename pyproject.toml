[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-loop"
version = "0.1.0"
description = "Headless Blender modeling workflow, machine tuning and closed-loop self-iteration toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LUgABeEEE", email = "LUgABeEEE@users.noreply.github.com" }]
keywords = ["blender", "headless", "3d-modeling", "closed-loop", "optimization", "silhouette"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
blender-loop = "blender_loop.cli:main"

[project.urls]
Homepage = "https://github.com/LUgABeEEE/blender-loop"
Issues = "https://github.com/LUgABeEEE/blender-loop/issues"
Changelog = "https://github.com/LUgABeEEE/blender-loop/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
